name: API Governance Linter

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  governance-lint:
    name: Run API Governance Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API Linter (Console Table)
        run: npx tsx src/index.ts lint openapi.json

      - name: Generate JUnit Test Report
        if: always()
        run: npx tsx src/index.ts lint openapi.json -f junit > junit-report.xml

      - name: Upload JUnit Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: junit-report.xml